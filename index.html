<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realms of Ember</title>
    <style>
      /* Le jeu occupe toute la fenêtre ; le fond reprend les couleurs de l'écran titre pour que le chargement ne clignote pas. */
      html, body { margin: 0; height: 100%; background: #0b0506; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; color: #f3d9c0; }
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #0b0506; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(circle at 50% 40%, #3a1208 0%, #0b0506 70%); }
      #loading h1 { margin: 0; font-size: clamp(28px, 5vw, 56px); letter-spacing: 0.12em; text-transform: uppercase; color: #ffd9b0; text-shadow: 0 0 24px #ff6a1f88; }
      #bar { width: min(420px, 70vw); height: 10px; border: 1px solid #ff8a3d88; border-radius: 6px; overflow: hidden; background: #1a0b08; }
      #bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff6a1f, #ffb347); transition: width 0.2s; }
      #hint { font-size: 14px; opacity: 0.75; text-align: center; max-width: 80vw; line-height: 1.5; }
      #toolbar { position: fixed; right: 10px; bottom: 10px; display: none; gap: 8px; }
      #toolbar button { background: #3b1a10cc; color: #ffd9b0; border: 1px solid #ff8a3d88; border-radius: 8px; padding: 6px 12px; font-size: 14px; cursor: pointer; }
      #toolbar button:hover { background: #5a2616; }
      #error { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #0b0506f2; font-size: 18px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="0"></canvas>
    <div id="loading">
      <h1>Realms of Ember</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="hint">Chargement du jeu… la première fois peut prendre une minute (environ 40 Mo), ensuite le navigateur le garde en mémoire.<br>Prévu pour un ordinateur, avec clavier et souris.</div>
    </div>
    <div id="toolbar"><button id="fullscreen" title="Plein écran (recommandé : Ctrl + chiffre fonctionne mieux)">Plein écran</button></div>
    <div id="error"><div id="error-text"></div></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var errorBox = document.querySelector("#error");

      function showError(message) {
        document.querySelector("#error-text").innerHTML = message;
        errorBox.style.display = "flex";
        document.querySelector("#loading").style.display = "none";
      }

      // Unity a besoin de WebGL 2 ; sans lui, un message clair vaut mieux qu'un écran noir.
      if (!document.createElement("canvas").getContext("webgl2")) {
        showError("Votre navigateur ne sait pas afficher ce jeu (WebGL 2 manque).<br>Essayez une version récente de Chrome, Edge, Firefox ou Safari, avec l'accélération graphique activée.");
      }

      // Le clic droit sert à donner des ordres : pas de menu du navigateur sur le jeu.
      canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });
      window.addEventListener("click", function () { canvas.focus(); });

      var config = {
        arguments: [],
        dataUrl: "Build/web.data.unityweb",
        frameworkUrl: "Build/web.framework.js.unityweb",
        codeUrl: "Build/web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "ZAPPAgency",
        productName: "Realms of Ember",
        productVersion: "0.1.0",
        showBanner: function (message, type) { if (type === "error") { showError("Le jeu a rencontré une erreur :<br>" + message); } }
      };

      var script = document.createElement("script");
      script.src = "Build/web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#bar-fill").style.width = (100 * progress) + "%";
        }).then(function (instance) {
          document.querySelector("#loading").style.display = "none";
          var toolbar = document.querySelector("#toolbar");
          toolbar.style.display = "flex";
          document.querySelector("#fullscreen").onclick = function () {
            instance.SetFullscreen(1);
            // En plein écran, le navigateur laisse le jeu recevoir Ctrl + chiffre (sinon il change d'onglet).
            if (navigator.keyboard && navigator.keyboard.lock) { navigator.keyboard.lock(); }
            canvas.focus();
          };
          canvas.focus();
        }).catch(function (message) { showError("Impossible de lancer le jeu :<br>" + message); });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
